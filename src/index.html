<!doctype html>
<html lang="en">
<head>
    <title>Mechanism2d Generator</title>
    <link rel="stylesheet" href="main.css"/>
    <script src="main.js" type="module"></script>
</head>

<div id="container" class="flex-row">
    <div class="flex-col">
        <div class="canvas-area">
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>

        <div id="bottom-panel" class="flex-col" style="padding: 0.5rem">
            <div class="group panel">
                <p class="legend">Object Properties</p>
                <div id="properties" class="flex-col" style="grid-row-gap: 0.5rem"></div>
            </div>
        </div>
    </div>

    <div
            id="side-panel"
            class="flex-col"
            style="padding: 0.5rem"
    >
        <div class="group panel">
            <p class="legend">Object Tree</p>
            <!-- i dont know what to name it ToT -->
            <div class="tree-and-actions"> 
                <ul id="tree">
                    <li>
                        <span class="caret name" id="mech">Mechanism</span>
                        <ul id="mech-objects" class="nested"></ul>
                    </li>
                </ul>
                <div class="space"></div>
                <div class="actions">
                    <button id="append">+ Add Ligament</button>
                    <button id="delete">- Delete Ligament</button>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
